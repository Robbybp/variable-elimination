[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "variable-elimination"
version = "0.1.0"
description = "Algorithms and test problems for variable elimination in nonlinear optimization problems."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    {name = "Robert Parker and Sakshi Naik"},
]
requires-python = ">=3.11"
dependencies = [
    #"cyipopt>=1.5.0",
    "gridx-egret>=0.5.5",
    "idaes-pse>=2.5.0",
    "matplotlib>=3.9.2",
    "networkx>=3.3",
    "nmpc_examples @ git+https://github.com/robbybp/nmpc_examples.git",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pselib @ git+https://github.com/Robbybp/pselib.git",
    "Pyomo>=6.8.0",
    "scipy>=1.14.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
]

[tool.setuptools.packages.find]
include = ["var_elim", "var_elim.*"]

[tool.setuptools.package-data]
"var_elim.models.distillation" = ["*.dat"]
"var_elim.models.opf" = ["*.m"]
